[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ril2m-agent"
version = "2025.1.0"
dependencies = [
    "langgraph>=0.4.1",
    "langchain>=0.3.25",
    "langchain-ollama>=0.3.2",
    "langchain-chroma>=0.2.4",
    "chromadb>=1.0.7",
    "mcp[cli]>=1.9.2",
    "PyGithub>=2.6.1",
    "gitpython>=3.1.44",
    "javalang>=0.13.0",
    "Jinja2>=3.1.6",
    "pygls>=2.0.0",
    "lsprotocol>=2024.0.0",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.1.0",
    "rich>=14.0.0",
    "typer>=0.16.0",
]

requires-python = ">=3.12"

authors = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]
maintainers = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]

description = "LangGraph + MCP agent that suggests @AccessMode annotations for Java Maven test cases using RAG and Ollama"
readme = "README.md"
license = { file = "LICENSE" }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.0.0",
    "flake8>=7.3.0",
]

[project.urls]
Homepage = "https://github.com/augustocristian/ril2m-agent"
Repository = "https://github.com/augustocristian/ril2m-agent"
"Bug Tracker" = "https://github.com/augustocristian/ril2m-agent/issues"

[project.scripts]
ril2m = "agent.cli:app"

[tool.pytest.ini_options]
addopts = "--cov=agent --cov-report=xml:coverage.xml --cov-branch"
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.setuptools.packages.find]
include = ["agent*"]
